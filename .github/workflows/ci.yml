name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: Smoke test (scan)
        shell: bash
        run: |
          ./target/release/rea-offline scan . --output report.json || ./target/release/rea-offline.exe scan . --output report.json
          test -s report.json
