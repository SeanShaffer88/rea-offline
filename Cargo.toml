[package]
name = "rea-offline"
version = "0.36.0"
edition = "2021"
description = "Offline-first Windows 11 x64 REA client with a local micro-LLM assistant"
license = "MIT"
repository = "https://github.com/SeanShaffer88/rea-offline"

# Zero external dependencies by design: this tool targets air-gapped machines.
# `cargo build --release` must succeed with no network access whatsoever.

[[bin]]
name = "rea-offline"
path = "src/main.rs"

[lib]
name = "rea_offline"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
